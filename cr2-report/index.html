<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR2 Report — copier-coller email</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;--bg2:#111113;--bg3:#1a1a1e;
  --border:#252528;--border2:#2e2e33;
  --text:#f0f0f2;--text2:#8b8b96;--text3:#5a5a62;
  --accent:#ff6b35;--accent2:#ff8c5a;
  --green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--blue:#60a5fa;
}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;min-height:100vh}
a{color:var(--accent)}

.topnav{display:flex;align-items:center;padding:0 20px;height:46px;border-bottom:1px solid var(--border);gap:14px;position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:.03em}
.logo span{color:var(--accent)}
.nav-note{font-size:10px;color:var(--text3)}
.acct-badge{margin-left:auto;font-size:10px;color:var(--text3);letter-spacing:.04em;text-align:right;line-height:1.5}
.acct-badge b{color:var(--accent)}
.acct-badge .tk{cursor:pointer;text-decoration:underline}

.controls{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.pill{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.05em;transition:all .15s}
.pill.active{background:rgba(255,107,53,.15);border-color:var(--accent);color:var(--accent)}
.controls input[type=date]{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:4px 8px;border-radius:5px;font-family:'DM Mono',monospace;font-size:11px;color-scheme:dark}
.btn{background:var(--accent);border:none;color:#0a0a0b;padding:6px 16px;border-radius:5px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}
.status{font-size:11px;color:var(--text3);margin-left:auto}

.body{max-width:1100px;margin:0 auto;padding:22px 20px 80px;display:flex;flex-direction:column;gap:22px}
.empty{color:var(--text3);text-align:center;padding:60px 0;font-size:12px;line-height:2}

.track-card{background:var(--bg2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.track-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.track-ttl{font-family:'Syne',sans-serif;font-weight:800;font-size:15px}
.track-tags{display:flex;gap:6px}
.ttag{font-size:9px;padding:2px 8px;border-radius:3px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.05em}
.ttag.exp{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.3)}
.ttag.scl{background:rgba(255,107,53,.15);color:var(--accent);border:1px solid rgba(255,107,53,.3)}
.ttag.cur{background:var(--bg3);color:var(--text3);border:1px solid var(--border2)}
.track-actions{margin-left:auto;display:flex;gap:8px}
.copied{color:var(--green)!important}

/* Bloc email — rendu clair, ce qui part dans Gmail */
.email-wrap{padding:18px;background:#141416}
.email-block{background:#ffffff;color:#1a1a1a;border-radius:6px;padding:20px 22px;font-family:Arial,Helvetica,sans-serif;font-size:13px;max-width:760px}
.email-block[contenteditable=true]{outline:none}
.email-block[contenteditable=true]:focus{box-shadow:0 0 0 2px var(--accent)}
.email-block table{border-collapse:collapse;margin:0 0 14px}
.email-block td,.email-block th{border:1px solid #cfcfcf;padding:7px 12px;font-size:13px;text-align:left}
.email-block .lbl{font-weight:bold;white-space:nowrap}
.email-block h3{font-size:15px;margin:16px 0 8px;font-family:Arial,Helvetica,sans-serif}
.email-block p{margin:0 0 12px;line-height:1.45}
.v-ok{color:#1a7f37;font-weight:bold}
.v-watch{color:#b45309;font-weight:bold}
.v-bad{color:#b91c1c;font-weight:bold}
.edit-hint{font-size:10px;color:var(--text3);padding:0 18px 14px;background:#141416}

.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);padding:12px 16px;border-radius:7px;font-size:12px;line-height:1.6}
</style>
</head>
<body>

<div class="topnav">
  <div class="logo">CR2 <span>REPORT</span></div>
  <div class="nav-note">roll-up + copier-coller email · <a href="/ads-reporter/" style="color:var(--text3)">← ads reporter</a></div>
  <div class="acct-badge">
    Sample Tools by Cr2 act_<b>110521542482244</b> ($) · campagnes EXPLORE/SCALE uniquement<br>
    <span class="tk" onclick="clearToken()">token</span>
  </div>
</div>

<div class="controls">
  <input type="date" id="dSince"> <span style="color:var(--text3)">→</span> <input type="date" id="dUntil">
  <span style="color:var(--text3);font-size:10px;margin:0 4px">présets :</span>
  <button class="pill" data-preset="today">Aujourd'hui</button>
  <button class="pill" data-preset="1">Hier</button>
  <button class="pill" data-preset="3">3 jours</button>
  <button class="pill" data-preset="7">7 jours</button>
  <button class="pill" data-preset="14">14 jours</button>
  <button class="btn" onclick="load()">Charger</button>
  <span class="status" id="status"></span>
</div>

<div class="body" id="body">
  <div class="empty">Choisis une période puis <b>Charger</b>.<br>Le bloc blanc de chaque track est éditable avant copie — clique dedans pour ajuster une note ou le verdict.</div>
</div>

<script>
// ════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════
const BASE = "https://graph.facebook.com/v19.0";
const ACCOUNTS = [
  { id: "act_110521542482244", cur: "$", name: "Sample Tools by Cr2" },
];

// Seuils internes (jamais imprimés dans l'email — verdicts seulement)
const TH = {
  cprOk: 0.20, cprWatch: 0.30,      // même barre numérique en $ et € (standard interne)
  ctrStrong: 2.5, ctrOk: 1.5,
  cpmLo: 3, cpmHi: 7, cpmAlarm: 8,
  freqMax: 2.5,
  winnerMinSpend: 10,               // jugeabilité d'une ad
};

let TOKEN = localStorage.getItem('era_meta_token') || '';

// ════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════
const $ = s => document.querySelector(s);
const today = () => new Date().toISOString().split('T')[0];
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; };
const esc = t => String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function getAction(actions, types) {
  if (!actions) return 0;
  for (const t of types) {
    const a = actions.find(x => x.action_type === t || x.action_type.includes(t));
    if (a) return parseInt(a.value) || 0;
  }
  return 0;
}
const VC_TYPES = ['view_content','offsite_conversion.fb_pixel_view_content'];

async function api(path) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(`${BASE}/${path}${sep}access_token=${TOKEN}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error.message || 'Meta API error');
  return d;
}

function ensureToken() {
  if (TOKEN) return true;
  const v = prompt('Token Meta (lecture) — stocké en local uniquement :');
  if (!v) return false;
  TOKEN = v.trim();
  localStorage.setItem('era_meta_token', TOKEN);
  return true;
}
function clearToken(){ localStorage.removeItem('era_meta_token'); TOKEN=''; alert('Token effacé.'); }

// ════════════════════════════════════════════════
// DATE RANGE
// ════════════════════════════════════════════════
function setRange(since, until) { $('#dSince').value = since; $('#dUntil').value = until; }
document.querySelectorAll('.pill').forEach(p => p.onclick = () => {
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');
  const pr = p.dataset.preset;
  if (pr === 'today') setRange(today(), today());
  else if (pr === '1') setRange(daysAgo(1), daysAgo(1));
  else setRange(daysAgo(parseInt(pr)), daysAgo(1)); // fenêtres glissantes finissant hier
});
// Défaut au chargement : 3 jours
setRange(daysAgo(3), daysAgo(1));
document.querySelector('[data-preset="3"]').classList.add('active');

function getRange() {
  const s = $('#dSince').value, u = $('#dUntil').value;
  if (!s || !u) throw new Error('Sélectionne les deux dates.');
  if (s > u) throw new Error('La date de début est après la date de fin.');
  return { since: s, until: u };
}
function nbDays(r) {
  return Math.max(1, Math.round((new Date(r.until) - new Date(r.since)) / 86400000) + 1);
}

// ════════════════════════════════════════════════
// LOAD
// ════════════════════════════════════════════════
async function load() {
  if (!ensureToken()) return;
  let range;
  try { range = getRange(); } catch(e) { alert(e.message); return; }
  const days = nbDays(range);
  const tr = `since=${range.since}&until=${range.until}`;
  const st = $('#status'); st.textContent = 'Chargement…';
  const body = $('#body'); body.innerHTML = '';

  try {
    const tracks = {}; // key → {name, cur, campaigns:[], ads:[]}

    for (const acc of ACCOUNTS) {
      st.textContent = `Chargement ${acc.name}…`;
      const camps = (await api(`${acc.id}/campaigns?fields=id,name,status&limit=200`)).data || [];
      // Convention de nommage : seules les campagnes EXPLORE/SCALE entrent dans le report
      const keep = camps.filter(c => /explore|scale/i.test(c.name));
      if (!keep.length) continue;

      // Insights niveau campagne sur la période (une requête par compte)
      const ins = (await api(`${acc.id}/insights?level=campaign&fields=campaign_id,campaign_name,reach,impressions,spend,cpm,ctr,frequency,actions&${tr}&limit=500`)).data || [];
      const insById = {}; for (const r of ins) insById[r.campaign_id] = r;

      for (const c of keep) {
        const row = insById[c.id];
        if (!row || !parseFloat(row.spend||0)) continue; // pas de spend sur la période → pas dans le report
        const kind = /scale/i.test(c.name) ? 'SCALE' : 'EXPLORE';
        const trackName = c.name.replace(/[-–—|·]*\s*(explore|scale)\s*[-–—|·]*/ig, ' ').replace(/\s+/g,' ').trim() || c.name;
        const key = acc.id + '::' + trackName.toLowerCase();
        if (!tracks[key]) tracks[key] = { name: trackName, cur: acc.cur, acc: acc.id, campaigns: [], ads: [] };
        tracks[key].campaigns.push({
          id: c.id, kind,
          spend: parseFloat(row.spend||0),
          impressions: parseInt(row.impressions||0),
          reach: parseInt(row.reach||0),
          ctr: parseFloat(row.ctr||0),
          vc: getAction(row.actions, VC_TYPES),
        });
      }
    }

    const list = Object.values(tracks);
    if (!list.length) {
      body.innerHTML = '<div class="empty">Aucune campagne avec du spend sur cette période.</div>';
      st.textContent = ''; return;
    }

    // Ads par track (winners)
    for (const t of list) {
      st.textContent = `Top ads — ${t.name}…`;
      for (const c of t.campaigns) {
        const [ads, links] = await Promise.all([
          api(`${c.id}/insights?level=ad&fields=ad_id,ad_name,spend,impressions,ctr,actions&${tr}&limit=100`).catch(()=>({data:[]})),
          api(`${c.id}/ads?fields=id,preview_shareable_link&limit=200`).catch(()=>({data:[]})),
        ]);
        const linkById = {}; for (const a of (links.data||[])) if (a.preview_shareable_link) linkById[a.id] = a.preview_shareable_link;
        for (const a of (ads.data||[])) {
          const spend = parseFloat(a.spend||0);
          const vc = getAction(a.actions, VC_TYPES);
          const impr = parseInt(a.impressions||0);
          if (!spend) continue;
          t.ads.push({
            name: a.ad_name, spend, vc, impr,
            cpr: vc ? spend/vc : Infinity,
            ctr: parseFloat(a.ctr||0),
            preview: linkById[a.ad_id] || null,
            kind: c.kind,
          });
        }
      }
    }

    render(list, range, days);
    const partial = range.until >= today() ? " · ⚠ inclut aujourd'hui — données partielles" : '';
    st.textContent = `${list.length} track(s) · ${range.since} → ${range.until}${partial}`;
  } catch (e) {
    body.innerHTML = `<div class="err"><b>Erreur Meta :</b> ${esc(e.message)}<br><br>
      Si c'est un problème de droits sur le compte CR2 (act_110521542482244), ton token actuel ne couvre peut-être que le compte ERA —
      génère un token utilisateur avec accès aux deux comptes, puis clique « token » en haut à droite pour le remplacer.</div>`;
    st.textContent = '';
  }
}

// ════════════════════════════════════════════════
// VERDICTS (mots seulement — pas de seuils imprimés)
// ════════════════════════════════════════════════
function vCPR(v){ if(!isFinite(v)) return ['—','']; if(v<TH.cprOk) return ['✓ healthy','v-ok']; if(v<TH.cprWatch) return ['→ watch','v-watch']; return ['✗ high','v-bad']; }
function vCTR(v){ if(v>=TH.ctrStrong) return ['✓ strong','v-ok']; if(v>=TH.ctrOk) return ['→ ok','v-watch']; return ['✗ weak','v-bad']; }
function vCPM(v){ if(v>TH.cpmAlarm) return ['✗ high','v-bad']; if(v>=TH.cpmLo&&v<=TH.cpmHi) return ['✓ in range','v-ok']; if(v<1) return ['✗ low quality','v-bad']; return ['→ watch','v-watch']; }
function vFreq(v){ return v<TH.freqMax ? ['✓ controlled','v-ok'] : ['✗ high','v-bad']; }

function periodLabel(r, days){
  const f = s => new Date(s+'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
  if (r.since === r.until) return `${f(r.since)} (1 day)`;
  return `${f(r.since)} – ${f(r.until)} (${days} days)`;
}

function verdictSentence(cpr,ctr,cpm,freq){
  const good = [];
  const bad = [];
  (cpr<TH.cprOk ? good : bad).push('CPR');
  (ctr>=TH.ctrStrong ? good : bad).push('CTR');
  (cpm>=TH.cpmLo&&cpm<=TH.cpmHi ? good : bad).push('CPM');
  (freq<TH.freqMax ? good : bad).push('frequency');
  if (!bad.length) return 'A very healthy day: strong CPR and CTR, controlled CPM and frequency.';
  if (bad.length === 4) return 'A weak day across the board — full review in progress on creatives and delivery.';
  return `Solid on ${good.join(', ')} — keeping an eye on ${bad.join(', ')}.`;
}

// ════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════
function render(list, range, days) {
  const body = $('#body');
  body.innerHTML = '';
  list.sort((a,b) => (b.campaigns.reduce((s,c)=>s+c.spend,0)) - (a.campaigns.reduce((s,c)=>s+c.spend,0)));

  for (const [i,t] of list.entries()) {
    const spend = t.campaigns.reduce((s,c)=>s+c.spend,0);
    const vc = t.campaigns.reduce((s,c)=>s+c.vc,0);
    const impr = t.campaigns.reduce((s,c)=>s+c.impressions,0);
    const reach = t.campaigns.reduce((s,c)=>s+c.reach,0);
    const ctr = impr ? t.campaigns.reduce((s,c)=>s+c.ctr*c.impressions,0)/impr : 0;
    const cpm = impr ? spend/impr*1000 : 0;
    const freq = reach ? impr/reach : 0;
    const cpr = vc ? spend/vc : Infinity;
    const cur = t.cur;

    const spendDay = spend/days, vcDay = Math.round(vc/days);
    const [cprW,cprC] = vCPR(cpr), [ctrW,ctrC] = vCTR(ctr), [cpmW,cpmC] = vCPM(cpm), [freqW,freqC] = vFreq(freq);

    // Winners : jugeables (spend ≥ seuil), CPR croissant, top 4
    const winners = t.ads.filter(a=>a.spend>=TH.winnerMinSpend && isFinite(a.cpr))
                         .sort((a,b)=>a.cpr-b.cpr).slice(0,4);
    // Si rien de jugeable, top spend
    const shown = winners.length ? winners : t.ads.sort((a,b)=>b.spend-a.spend).slice(0,3);

    const kinds = [...new Set(t.campaigns.map(c=>c.kind))];
    const perDayLabel = days>1 ? ' (per day average)' : '';

    const emailHtml = `
<p><b>${esc(t.name)}</b><br><span style="color:#555">Period: ${periodLabel(range, days)}</span></p>
<table>
  <tr><td class="lbl">Spend${days>1?' (per day average)':''}</td><td>${cur}${spendDay.toFixed(2)}</td></tr>
  <tr><td class="lbl">Results (content views)${days>1?' — per day avg':''}</td><td>${days>1?vcDay:vc}</td></tr>
  <tr><td class="lbl">CPR (cost per result)</td><td>${cur}${isFinite(cpr)?cpr.toFixed(2):'—'} <span class="${cprC}">${cprW}</span></td></tr>
  <tr><td class="lbl">CTR</td><td>${ctr.toFixed(2)}% <span class="${ctrC}">${ctrW}</span></td></tr>
  <tr><td class="lbl">CPM</td><td>${cur}${cpm.toFixed(2)} <span class="${cpmC}">${cpmW}</span></td></tr>
  <tr><td class="lbl">Frequency</td><td>${freq.toFixed(2)} <span class="${freqC}">${freqW}</span></td></tr>
  <tr><td class="lbl">Impressions / reach</td><td>${impr.toLocaleString('en-US')} / ${reach.toLocaleString('en-US')}</td></tr>
</table>
<p>${verdictSentence(cpr,ctr,cpm,freq)}</p>
<h3>Winning ads${perDayLabel}</h3>
<table>
  <tr><th>Ad</th><th>CPR</th><th>CTR</th><th>Spend</th><th>Results</th><th>Preview</th></tr>
  ${shown.map(a=>`<tr>
    <td>${esc(a.name)}</td>
    <td>${cur}${isFinite(a.cpr)?a.cpr.toFixed(2):'—'}</td>
    <td>${a.ctr.toFixed(2)}%</td>
    <td>${cur}${(a.spend/days).toFixed(2)}</td>
    <td>${Math.round(a.vc/days)}</td>
    <td>${a.preview?`<a href="${esc(a.preview)}">View</a>`:'—'}</td>
  </tr>`).join('')}
</table>`;

    const card = document.createElement('div');
    card.className = 'track-card';
    card.innerHTML = `
      <div class="track-hdr">
        <div class="track-ttl">${esc(t.name)}</div>
        <div class="track-tags">
          ${kinds.map(k=>`<span class="ttag ${k==='SCALE'?'scl':'exp'}">${k}</span>`).join('')}
          <span class="ttag cur">${cur==='$'?'USD':'EUR'}</span>
        </div>
        <div class="track-actions">
          <button class="btn" onclick="copyEmail(this,'eb${i}')">Copier pour email</button>
        </div>
      </div>
      <div class="email-wrap"><div class="email-block" id="eb${i}" contenteditable="true">${emailHtml}</div></div>
      <div class="edit-hint">Bloc éditable — ajuste une note (ex. DSP exclus) ou le verdict avant de copier. La copie garde le format tableau dans Gmail.</div>
    `;
    body.appendChild(card);
  }
}

// ════════════════════════════════════════════════
// COPY (HTML + texte)
// ════════════════════════════════════════════════
async function copyEmail(btn, id) {
  const el = document.getElementById(id);
  const html = el.innerHTML;
  const text = el.innerText;
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([text], {type:'text/plain'}),
    })]);
  } catch {
    // Fallback : sélection + execCommand
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand('copy'); sel.removeAllRanges();
  }
  const old = btn.textContent;
  btn.textContent = '✓ Copié'; btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent = old; btn.classList.remove('copied'); }, 1800);
}
</script>
</body>
</html>
