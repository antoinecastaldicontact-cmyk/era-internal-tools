name: Spotify streams → Airtable (ERA)

# Relevé quotidien du playcount Spotify, écrit dans la table Songs (ligne J-1).
# Cron en UTC : 07:37 UTC = 08:37 Paris en hiver, 09:37 en été — même créneau que l'ancien scénario Make 9213141 (09:00 Paris).
# Garder un horaire fixe : daily_streams est un écart entre deux relevés consécutifs.
on:
  schedule:
    - cron: '37 7 * * *'
  # Toute modification du job lance un dry run (aucune écriture Airtable).
  push:
    branches: [main]
    paths:
      - 'jobs/spotify-streams/**'
      - '.github/workflows/spotify-streams.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Lire les streams sans rien écrire dans Airtable"
        type: boolean
        default: true
      test_ids:
        description: "Mode test : IDs Spotify séparés par des virgules (aucun appel Airtable)"
        type: string
        default: ""

concurrency:
  group: spotify-streams
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/spotify-streams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Relever les streams
        run: node scrape.mjs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ORIGINS: ERA
          # Un push n'écrit jamais : dry run complet si le secret Airtable existe, sinon lecture des 4 titres témoins.
          DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && '1' || '0' }}
          TEST_IDS: ${{ (github.event_name == 'push' && secrets.AIRTABLE_TOKEN == '') && '6pC3dvvvEbmxvVnKsCkBVm,5se5BnFIsMf0CVTno42pq0,4hEYkH9bBbSEHNrts1iz3a,4cRXvR0xaasQCwlaYMt9b8' || inputs.test_ids }}
