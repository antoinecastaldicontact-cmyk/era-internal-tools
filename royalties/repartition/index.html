<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ERA · Répartition mensuelle</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/royalties/style.css">
</head>
<body>
<main class="wrap" id="app"><div class="loading">Chargement de la répartition…</div></main>
<script src="/royalties/lib.js"></script>
<script src="/royalties/viz.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const { C } = V;
  const projectHref = (id) => `/royalties/projet/?id=${encodeURIComponent(id)}`;
  const S = { all: false, open: {} };
  let D;

  async function start(refresh) {
    app.innerHTML = '<div class="loading">Chargement de la répartition…</div>';
    try {
      D = await R.model({ refresh });
      if (!D.repartition) { D = await R.model({ refresh: true }); }
      render();
    } catch (e) {
      if (e.code === 'no_key' || e.code === 'unauthorized') {
        return R.lock(app, e.code === 'unauthorized' ? 'Clé refusée. Colle la bonne clé ROYALTIES_ADMIN_KEY.' : null, () => start());
      }
      app.innerHTML = `<div class="err"><b>Impossible de charger les données.</b><br>${R.esc(R.errorText(e.code))}</div>`;
    }
  }

  const row = (m) => D.repartition.find((r) => r.m === m);
  const kpi = (l, v, s) => `<div class="kpi"><div class="kpi-l">${R.esc(l)}</div><div class="kpi-v">${v}</div><div class="kpi-s">${s}</div></div>`;
  const signed = (v) => (v > 0 ? '+' : '') + R.eur(v);

  function render() {
    const rows = D.repartition;
    const cu = D.coverage.completeUntil;
    const nowRow = row(D.now) || rows[rows.length - 1];
    const last = row(cu);
    const stm = D.statements.find((s) => s.received) || D.statements[0];
    const lastRun = D.statements.find((s) => /^\d{4}-\d{2}$/.test(s.name));

    app.innerHTML = `
      <div class="brand"><a href="/">ERA · Internal</a><span>/</span><a href="/royalties/">Royalties</a><span>/</span><span>Répartition</span></div>
      ${R.nav('repartition')}
      <div class="top">
        <div>
          <h1>Répartition <b>mensuelle</b></h1>
          <p class="sub">Un tableau à deux vitesses. <b>Vitesse 1</b> : ce qu’on dépense dans le mois, connu le jour même. <b>Vitesse 2</b> : ce que rapportent les écoutes du mois, connu deux à trois mois plus tard (relevé Wiseband du 15 : le mois M arrive partiel à M+2, sans Spotify, Deezer ni Qobuz, puis complet à M+3).<br>
          Revenus complets jusqu’à <b>${R.mLong(cu)}</b> · ${R.mLong(D.coverage.partialUntil)} partiel · générée ${R.esc(R.dateTime(D.generatedAt))}</p>
        </div>
        <div class="actions"><button class="btn primary" id="mailbtn" aria-expanded="false">Email les statements</button><button class="btn" id="refresh">↻ Rafraîchir</button></div>
      </div>
      <div id="mailpanel"></div>
      ${D.checks && D.checks.length ? `<div class="banner"><b>${D.checks.length} écart(s)</b> entre les lignes mensuelles et Airtable : voir le bandeau de la vue macro.</div>` : ''}

      <div class="kpis">
        ${kpi(`${R.mLong(nowRow.m)} · dépensé`, R.eur(nowRow.spend.total), `capex ${R.eur(nowRow.spend.capex)} · catalogue ${R.eur(nowRow.spend.catalogue)}`)}
        ${kpi(`${R.mLong(nowRow.m)} · revenus`, R.STATE[nowRow.state].fr, R.esc(R.stateText(nowRow.state, nowRow.expected)))}
        ${last ? kpi(`${R.mLong(cu)} · marge nette recoupées`, R.eur(last.recouped.margin), `${last.recouped.count} titre(s) · couverture ${R.pct(last.coverage)} des ${R.eur(D.structureCosts)} de structure`) : ''}
        ${last ? kpi(`${R.mLong(cu)} · non recoupées`, signed(last.recouping.variation), `récupéré ${R.eur(last.recouping.recovered)} − investi ${R.eur(last.recouping.invested)}`) : ''}
        ${last ? kpi(`Reste à recouper · fin ${R.mShort(cu)}`, R.eur(last.recouping.remainingEnd), 'seuils contrat (montant fixe si prévu, sinon marketing)') : ''}
        ${lastRun ? kpi('Dernier relevé reçu', R.eur(lastRun.newMoney), `${R.esc(lastRun.name)} · écoutes ${R.mShort(lastRun.usageFrom)} → ${R.mShort(lastRun.usageTo)}`) : stm ? kpi('Dernier relevé reçu', R.eur(stm.newMoney), R.esc(stm.name)) : ''}
      </div>

      <div class="card">
        <div class="card-h"><div><div class="card-t">Les trois poches, mois d’écoute par mois d’écoute</div>
        <div class="card-d">Marge nette des titres recoupés (nette de royalties et de leurs dépenses), revenus qui remboursent les titres non recoupés, et ce qu’on y a investi. Barres pâles et zone hachurée : revenus partiels ou pas encore reportés.</div></div></div>
        <div class="chart" id="c-pockets"></div>
      </div>

      <div class="card">
        <div class="card-h"><div><div class="card-t">Tableau à deux vitesses</div>
        <div class="card-d">Une ligne par mois, le plus récent en haut. Clic sur une ligne : le détail par titre.</div></div>
        <div class="seg" id="seg-all"><button data-v="12">12 mois</button><button data-v="all">Tout</button></div></div>
        <div class="tbl-wrap" id="tbl"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <div class="card-t">Relevés reçus</div>
          <div class="card-d">L’encaissement : ce que chaque relevé a apporté de nouveau, et les mois d’écoute qu’il couvre.</div>
          <div class="tbl-wrap" style="margin-top:10px">${statementsTable()}</div>
        </div>
        <div class="card defs">
          <details open>
            <summary>Comment c’est calculé</summary>
            <ul>
              <li><b>Recoupé</b> : revenus bruts cumulés ≥ seuil du contrat (montant fixe quand il existe, sinon dépenses marketing cumulées). Une fois recoupé, un titre le reste : les ads lancées après sont un coût label.</li>
              <li><b>Capex</b> : dépenses du mois sur les titres pas encore recoupés au début du mois (marketing, avances, frais compte artiste). <b>Catalogue</b> : dépenses sur les titres déjà recoupés et campagnes playlist sans titre.</li>
              <li><b>Marge nette recoupées</b> = revenu part ERA − royalties dues aux artistes − dépenses du mois sur ces titres. Royalties dues : Wiseband = max(revenu − part label × brut, 0) ; ADA = brut × (1 − part label). Titres sans part label (Mara, Soul) : hors marge.</li>
              <li><b>Mois de bascule</b> : la part des revenus jusqu’au seuil rembourse (non recoupées), l’excédent compte en marge.</li>
              <li><b>Récupéré − investi</b> (non recoupées) : positif = le capital à risque baisse.</li>
              <li><b>Couverture</b> = marge nette recoupées ÷ ${R.eur(D.structureCosts)} de coûts de structure mensuels.</li>
            </ul>
          </details>
        </div>
      </div>

      <div class="foot"><span>ERA · Cockpit royalties · répartition</span><span>Données : Airtable appBvSWFIA6P36nXu</span></div>`;

    document.getElementById('refresh').onclick = () => start(true);
    document.getElementById('mailbtn').onclick = (ev) => {
      const el = document.getElementById('mailpanel');
      const open = !el.innerHTML;
      el.innerHTML = open ? mailPanel() : '';
      ev.currentTarget.setAttribute('aria-expanded', String(open));
    };
    const seg = document.getElementById('seg-all');
    const sync = () => seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', (b.dataset.v === 'all') === S.all));
    seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { S.all = b.dataset.v === 'all'; sync(); drawTable(); }));
    sync();
    drawChart();
    drawTable();
  }

  function drawChart() {
    const rows = D.repartition.slice(-14);
    const months = rows.map((r) => r.m);
    const dim = (i) => rows[i].state !== 'complete';
    V.bars(document.getElementById('c-pockets'), {
      months, h: 270, xFmt: R.mShort, tipFmt: R.mLong, yFmt: R.eurC, yTip: R.eur,
      shadeFrom: D.coverage.completeUntil, shadeLabel: 'partiel · attendu',
      label: 'Marge nette des titres recoupés, récupéré et investi sur les titres non recoupés, par mois',
      series: [
        { name: 'Marge nette (recoupées)', color: C.blue, values: rows.map((r) => r.recouped.margin), dim },
        { name: 'Récupéré (non recoupées)', color: C.aqua, values: rows.map((r) => r.recouping.recovered), dim },
        { name: 'Investi (non recoupées)', color: C.orange, values: rows.map((r) => r.recouping.invested) },
      ],
      note: (i) => `<div class="tip-note">${R.esc(R.stateText(rows[i].state, rows[i].expected))}</div>`,
    });
  }

  function drawTable() {
    const all = [...D.repartition].reverse();
    const rows = S.all ? all : all.slice(0, 12);
    const na = '<td class="na">—</td>';
    const money = (r, v, sep) => (r.state === 'pending' ? `<td class="na${sep ? ' sep' : ''}">—</td>` : `<td${sep ? ' class="sep"' : ''}>${R.eur(v)}</td>`);
    const body = rows.map((r) => {
      const pend = r.state === 'pending';
      const open = !!S.open[r.m];
      const main = `<tr class="rp-row${r.m === D.now ? ' now' : ''}" data-m="${r.m}" tabindex="0" role="button" aria-expanded="${open}">
        <td class="l m"><span class="rp-chev" aria-hidden="true">›</span> ${R.esc(R.mLong(r.m))}</td>
        <td class="sep"><b>${R.eur(r.spend.total)}</b></td><td>${R.eur(r.spend.capex)}</td><td>${R.eur(r.spend.catalogue)}</td>
        <td class="l sep">${R.stateChip(r.state, r.expected)}</td>
        ${pend ? na : `<td><b>${R.eur(r.recouped.margin)}</b></td>`}
        ${pend ? na : `<td>${R.pct(r.coverage)}</td>`}
        ${money(r, r.recouping.recovered, true)}
        ${pend ? na : `<td>${signed(r.recouping.variation)}</td>`}
        <td>${R.eur(r.recouping.remainingEnd)}</td>
        ${money(r, r.nospend.revenue, true)}
        <td class="sep">${r.statementReceived != null ? R.eur(r.statementReceived) : '<span style="color:var(--text3)">—</span>'}</td>
      </tr>`;
      return main + (open ? `<tr class="detail"><td colspan="12">${detail(r)}</td></tr>` : '');
    }).join('');
    const el = document.getElementById('tbl');
    el.innerHTML = `<table class="rp">
      <thead>
        <tr class="grp"><th class="l"></th><th class="sep" colspan="3">Vitesse 1 · dépensé dans le mois</th><th class="sep" colspan="3">Vitesse 2 · recoupées</th><th class="sep" colspan="3">Non recoupées</th><th class="sep">Catalogue</th><th class="sep">Encaissé</th></tr>
        <tr><th class="l">Mois</th><th class="sep">Total</th><th>Capex</th><th>Catalogue</th><th class="l sep">Revenus</th><th>Marge nette</th><th>Couverture</th><th class="sep">Récupéré</th><th>Variation</th><th>Reste</th><th class="sep">Sans invest.</th><th class="sep">Relevé reçu</th></tr>
      </thead><tbody>${body}</tbody></table>`;
    el.querySelectorAll('tr.rp-row').forEach((tr) => {
      const toggle = () => { S.open[tr.dataset.m] = !S.open[tr.dataset.m]; drawTable(); };
      tr.addEventListener('click', toggle);
      tr.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
    });
  }

  function detail(r) {
    const by = (k) => r.projects.filter((p) => p.pocket === k);
    const link = (p) => `<a href="${projectHref(p.id)}" style="text-decoration:none">${R.esc(p.title)}</a>`;
    const rec = [...by('recouped'), ...r.projects.filter((p) => p.crossing)];
    const recRows = rec.map((p) => p.noLabelCut
      ? `<tr><td class="t">${link(p)}<span class="tag">sans part label</span></td><td>${R.eur(p.revenue)}</td><td>—</td><td>${R.eur(p.spend)}</td><td>hors marge</td></tr>`
      : `<tr><td class="t">${link(p)}${p.crossing ? '<span class="tag">bascule</span>' : ''}</td><td>${p.crossing ? '' : R.eur(p.revenue)}</td><td>${p.crossing ? '' : R.eur(p.dues)}</td><td>${p.crossing ? '' : R.eur(p.spend)}</td><td>${R.eur(p.margin)}</td></tr>`).join('');
    const ing = [...by('recouping'), ...by('crossing')].sort((a, b) => (b.recovered + b.spend) - (a.recovered + a.spend));
    const TOP = 10;
    const ingRows = ing.slice(0, TOP).map((p) => `<tr><td class="t">${link(p)}${p.crossing ? '<span class="tag">bascule</span>' : ''}</td><td>${R.eur(p.recovered)}</td><td>${R.eur(p.spend)}</td></tr>`).join('')
      + (ing.length > TOP ? `<tr><td class="t" style="color:var(--text2)">${ing.length - TOP} autres</td><td>${R.eur(ing.slice(TOP).reduce((a, p) => a + p.recovered, 0))}</td><td>${R.eur(ing.slice(TOP).reduce((a, p) => a + p.spend, 0))}</td></tr>` : '');
    const ns = by('nospend').sort((a, b) => b.revenue - a.revenue);
    const nsRows = ns.slice(0, 8).map((p) => `<tr><td class="t">${link(p)}</td><td>${R.eur(p.revenue)}</td></tr>`).join('')
      + (ns.length > 8 ? `<tr><td class="t" style="color:var(--text2)">${ns.length - 8} autres</td><td>${R.eur(ns.slice(8).reduce((a, p) => a + p.revenue, 0))}</td></tr>` : '');
    const state = `<p style="font-size:12px;color:var(--text2);margin-bottom:12px">${R.stateChip(r.state, r.expected)} ${R.esc(R.stateText(r.state, r.expected))}${r.spend.unassigned ? ` · ${R.eur(r.spend.unassigned)} de campagnes playlist sans titre (catalogue).` : ''}${r.recouped.noLabelCut.count ? ` · ${R.eur(r.recouped.noLabelCut.revenue)} de revenus recoupés sans part label, hors marge.` : ''}</p>`;
    return `${state}<div class="dgrid">
      <div class="dcol"><h4>Recoupées · marge nette</h4>${recRows ? `<table class="dl"><tr><th class="t"></th><th>Part ERA</th><th>Royalties</th><th>Dépenses</th><th>Marge</th></tr>${recRows}<tr><td class="t" style="color:var(--text2)">Total</td><td>${R.eur(r.recouped.revenue)}</td><td>${R.eur(r.recouped.dues)}</td><td>${R.eur(r.recouped.spend)}</td><td><b>${R.eur(r.recouped.margin)}</b></td></tr></table>` : '<div class="empty">Aucun titre recoupé actif ce mois.</div>'}</div>
      <div class="dcol"><h4>Non recoupées · récupéré vs investi</h4>${ingRows ? `<table class="dl"><tr><th class="t"></th><th>Récupéré</th><th>Investi</th></tr>${ingRows}<tr><td class="t" style="color:var(--text2)">Total</td><td>${R.eur(r.recouping.recovered)}</td><td>${R.eur(r.recouping.invested)}</td></tr></table>` : '<div class="empty">Rien ce mois.</div>'}</div>
      <div class="dcol"><h4>Catalogue sans investissement</h4>${nsRows ? `<table class="dl"><tr><th class="t"></th><th>Part ERA</th></tr>${nsRows}</table>` : '<div class="empty">Rien ce mois.</div>'}</div>
    </div>`;
  }

  // The statement batch = the latest statement(s) received, never the archive. Only the
  // releases present in it (Warner titles only when a Warner statement came in).
  function mailPanel() {
    const dated = D.statements.filter((st) => st.received && !/^ARCHIVE/i.test(st.name));
    if (!dated.length) return '<div class="mailp"><h3>Aucun relevé à envoyer</h3><p>Pas encore de relevé mensuel dans Airtable.</p></div>';
    const month = dated[0].received.slice(0, 7);
    const batch = dated.filter((st) => st.received.slice(0, 7) === month);
    const ids = new Set(batch.flatMap((st) => st.projects || []));
    const projects = D.projects.filter((p) => ids.has(p.id) && R.statementEligible(p) && p.artistPath);
    const rec = R.recipients(projects);
    const covered = new Set(rec.flatMap((r) => r.projects.map((p) => p.id)));
    const missing = projects.filter((p) => !covered.has(p.id));
    const rows = rec.map((r) => `<div class="row">
        <div class="who">${R.esc(r.name)}<span>${R.esc(r.email)}</span></div>
        <div class="what">${r.projects.map((p) => `${R.esc(p.title)} · ${R.esc(R.statusEn(p))}`).join('<br>')}</div>
        <a class="btn" href="${R.esc(R.mailto([r.email], R.statementBody(r.name, r.projects)))}">Ouvrir l’e-mail</a>
      </div>`).join('');
    return `<div class="mailp">
      <h3>Statements du relevé ${R.esc(batch.map((st) => st.name).join(' + '))} · reçu le ${R.esc(R.date(dated[0].received))}</h3>
      <p>${projects.length} titre(s) présents dans ce relevé, ${rec.length} destinataire(s). Chaque bouton ouvre ton client mail avec le message prêt, en anglais, sans objet. Rien ne part tant que tu ne cliques pas sur Envoyer.</p>
      <div class="rows">${rows || '<p>Aucun payee avec e-mail sur ces titres.</p>'}</div>
      ${missing.length ? `<p class="miss">Sans e-mail de payee dans Airtable : ${missing.map((p) => R.esc(p.title)).join(', ')}.</p>` : ''}
    </div>`;
  }

  function statementsTable() {
    const rows = D.statements.map((s) => `<tr><td class="t">${R.esc(s.name)}</td><td>${s.received ? R.date(s.received) : '—'}</td><td>${s.usageFrom ? `${R.mShort(s.usageFrom)} → ${R.mShort(s.usageTo)}` : '—'}</td><td class="n">${R.eur(s.newMoney)}</td></tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Relevé</th><th>Reçu le</th><th>Mois d’écoute</th><th class="n">Nouvel argent</th></tr></thead><tbody>${rows}</tbody></table>
      <p style="font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5">L’archive (ARCHIVE-WB) et les relevés Warner trimestriels n’ont pas de mois de paiement : la colonne « Relevé reçu » du tableau se remplit à partir des relevés mensuels (premier : 2026-11).</p>`;
  }

  start();
})();
</script>
</body>
</html>
